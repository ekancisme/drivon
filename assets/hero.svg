<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/><stop offset="0.48" stop-color="#151044"/><stop offset="1" stop-color="#042A38"/>
    </linearGradient>
    <linearGradient id="neon" x1="190" y1="95" x2="820" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#22D3EE;#A78BFA" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#F472B6;#22D3EE" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="orb"><stop stop-color="#22D3EE" stop-opacity=".8"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#8B5CF6" stroke-opacity=".12"/></pattern>
    <clipPath id="round"><rect width="1000" height="320" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;28 28" dur="4s" repeatCount="indefinite"/></rect>
    <circle cx="80" cy="75" r="130" fill="url(#orb)"><animate attributeName="r" values="110;145;110" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="265" r="150" fill="url(#orb)" opacity=".45"><animate attributeName="r" values="145;105;145" dur="7s" repeatCount="indefinite"/></circle>
    <g opacity=".65" fill="#22D3EE">
      <circle cx="95" cy="250" r="2"><animate attributeName="cy" values="250;35;250" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="60" r="3"><animate attributeName="cy" values="60;290;60" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="265" r="2"><animate attributeName="cx" values="780;930;780" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="45" r="2"><animate attributeName="cx" values="180;55;180" dur="8s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M65 245C180 190 210 290 330 238S530 178 650 230 820 270 940 205" stroke="url(#neon)" stroke-width="2" opacity=".35" stroke-dasharray="8 12"><animate attributeName="stroke-dashoffset" values="0;-200" dur="10s" repeatCount="indefinite"/></path>
    <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
      <text x="500" y="104" fill="#94A3B8" font-size="14" letter-spacing="6">NEXT-GENERATION CAR RENTAL &amp; FLEET MANAGEMENT</text>
      <text x="500" y="170" fill="url(#neon)" font-size="54" font-weight="800" filter="url(#glow)">?? DRIVON</text>
      <text x="500" y="214" fill="#E2E8F0" font-size="19" letter-spacing="2">SPRING BOOT 3  •  MONGODB  •  REACT 18  •  PAYOS  •  WEBSOCKET</text>
      <text x="500" y="259" fill="#67E8F9" font-family="monospace" font-size="15">&lt;code&gt; search ? instant booking ? automated payment ? digital contract &lt;/code&gt;<animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></text>
    </g>
    <rect x="14" y="14" width="972" height="292" rx="18" stroke="url(#neon)" stroke-opacity=".55" stroke-width="2" stroke-dasharray="120 28"><animate attributeName="stroke-dashoffset" values="0;-296" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>