      <text x="0" y="76" font-size="35">💼</text>
      <text x="0" y="126" fill="#C4B5FD" font-size="17" font-weight="700">FPT Software</text>
      <text x="0" y="150" fill="#94A3B8" font-size="13">Frontend Internship</text>
    </g>
    <g transform="translate(450 0)">
      <circle cx="0" cy="65" r="35" fill="#22D3EE" opacity=".13"><animate attributeName="r" values="38;31;38" dur="4.5s" repeatCount="indefinite"/></circle>
      <text x="0" y="76" font-size="35">🚀</text>
      <text x="0" y="126" fill="#67E8F9" font-size="17" font-weight="700">2 Flagship Builds</text>
      <text x="0" y="150" fill="#94A3B8" font-size="13">LexiGrow + Drivon</text>
