<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="190"><stop stop-color="#0D1117"/><stop offset=".5" stop-color="#17133A"/><stop offset="1" stop-color="#082F3A"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#8B5CF6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="896" height="186" rx="18" fill="url(#bg)" stroke="url(#line)" stroke-width="2" stroke-dasharray="120 20"><animate attributeName="stroke-dashoffset" values="0;-280" dur="10s" repeatCount="indefinite"/></rect>
