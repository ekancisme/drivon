  <circle cx="27" cy="25" r="3" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="873" cy="165" r="3" fill="#F472B6" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
